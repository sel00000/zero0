[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "so101-wam"
version = "0.1.0"
description = "Compact dual-SO-101 physical-prompt world-action research prototype"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "zero01 contributors" }]
dependencies = [
  "numpy>=1.26,<3",
  "torch>=2.3,<3",
]

[project.optional-dependencies]
sim = ["mujoco>=3.12.0,<4"]
hardware = ["lerobot[core_scripts,feetech]==0.6.1"]

[project.scripts]
so101-wam-doctor = "so101_wam.hardware_doctor:main"
so101-wam-hardware = "so101_wam.hardware_cli:main"
so101-wam-ifp-ablation = "so101_wam.ifp_ablation:main"
so101-wam-ifp-study = "so101_wam.ifp_study:main"
so101-wam-mujoco = "so101_wam.mujoco_cli:main"
so101-wam-mujoco-benchmark = "so101_wam.mujoco_benchmark:main"
so101-wam-mujoco-prompt-controls = "so101_wam.mujoco_prompt_controls:main"
so101-wam-paired-semantic-controls = "so101_wam.mujoco_paired_semantic_prompt_controls:main"
so101-wam-mujoco-semantic-benchmark = "so101_wam.mujoco_semantic_benchmark:main"
so101-wam-mujoco-semantic-prompt-controls = "so101_wam.mujoco_semantic_prompt_controls:main"
so101-wam-mujoco-semantic-suite = "so101_wam.mujoco_semantic_suite:main"
so101-wam-paired-data = "so101_wam.paired_data_cli:main"
so101-wam-preflight = "so101_wam.hardware_preflight:main"
so101-wam-prompt-controls = "so101_wam.prompt_controls:main"
so101-wam-record-prompt = "so101_wam.prompt_recorder:main"
so101-wam-record-demo = "so101_wam.demo_recorder:main"
so101-wam-robot-free = "so101_wam.robot_free_cli:main"
so101-wam-robot-free-semantic = "so101_wam.robot_free_semantic_cli:main"
so101-wam-verify-robot-free = "so101_wam.robot_free_verifier:main"
so101-wam-train = "so101_wam.train_cli:main"
so101-wam-train-paired = "so101_wam.paired_train_cli:main"
so101-wam-certify = "so101_wam.certify_cli:main"
so101-wam-decoder-ablation = "so101_wam.decoder_ablation:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
so101_wam = [
  "assets/*.md",
  "assets/*.xml",
  "assets/configs/*.toml",
  "assets/mujoco_menagerie/robotstudio_so101/*.md",
  "assets/mujoco_menagerie/robotstudio_so101/*.xml",
  "assets/mujoco_menagerie/robotstudio_so101/*.png",
  "assets/mujoco_menagerie/robotstudio_so101/LICENSE",
  "assets/mujoco_menagerie/robotstudio_so101/assets/*.stl",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"

[[tool.mypy.overrides]]
module = ["lerobot.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
