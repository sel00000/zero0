[runtime]
backend = "fake"
camera_hz = 30.0
policy_hz = 10.0
servo_hz = 50.0
context_seconds = 30.0
prompt_min_seconds = 3.0
prompt_max_seconds = 12.0
action_horizon = 10
primary_cameras = ["left_wrist", "right_wrist"]
use_head_camera = false
actuation_enabled = false

[safety]
calibrated = false
# Fake normalized LeRobot ranges only. Replace with measured per-arm calibration
# before creating a hardware config; deployment remains disabled in this file.
joint_lower = [-100, -100, -100, -100, -100, 0, -100, -100, -100, -100, -100, 0]
joint_upper = [100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100, 100]
max_delta_per_servo_tick = [2, 2, 2, 2, 2, 4, 2, 2, 2, 2, 2, 4]
max_observation_age_s = 0.10
max_camera_skew_s = 0.017
watchdog_timeout_s = 0.10

[lerobot]
version = "0.6.1"
robot_type = "bi_so_follower"
robot_id = "so101_wam"
left_port = ""
right_port = ""
